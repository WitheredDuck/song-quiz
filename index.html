<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Song Quiz</title>
</head>

<body>
	<header>
		<h1>Song Quiz</h1>
	</header>

	<main>
        <label for="play-duration">Play duration (seconds)</label>
        <input id="play-duration" type="number" min="1" step="1" value="10" />
        <input id="zip-upload" type="file" accept=".zip,audio/mpeg" />
	</main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        document.querySelector("#zip-upload").addEventListener("change", async event => {
            const zipFile = event.target.files[0];
            if (!zipFile) return;

            const durationInput = document.querySelector("#play-duration");
            const playDuration = Number(durationInput.value);
            if (!Number.isFinite(playDuration) || playDuration <= 0) {
                durationInput.value = 15;
                durationInput.focus();
                return;
            }

            event.target.hidden = true;

            const zip = await JSZip.loadAsync(zipFile);
            const tracks = [];

            for (const entry of Object.values(zip.files)) {
                if (entry.dir || !entry.name.toLowerCase().endsWith(".mp3")) continue;

                const audioBlob = await entry.async("blob");
                const audioUrl = URL.createObjectURL(audioBlob);
                tracks.push({ name: entry.name.split("/").pop(), url: audioUrl });
            }

            if (tracks.length === 0) {
                event.target.hidden = false;
                return;
            }

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.autoplay = true;

            const songSelect = document.createElement("select");
            songSelect.id = "song-select";
            const placeholder = document.createElement("option");
            placeholder.textContent = "Choose the song";
            placeholder.value = "";
            placeholder.disabled = true;
            placeholder.selected = true;
            songSelect.appendChild(placeholder);
            for (const track of tracks) {
                const option = document.createElement("option");
                option.value = track.url;
                option.textContent = track.name;
                songSelect.appendChild(option);
            }

            const feedback = document.createElement("p");
            const anotherButton = document.createElement("button");
            anotherButton.type = "button";
            anotherButton.textContent = "Another song";
            anotherButton.hidden = true;
            let currentTrack;
            let stopTimer;

            const startRound = () => {
                clearTimeout(stopTimer);
                currentTrack = tracks[Math.floor(Math.random() * tracks.length)];
                songSelect.value = "";
                feedback.textContent = "";
                anotherButton.hidden = true;
                audio.pause();
                audio.src = currentTrack.url;
                audio.addEventListener("loadedmetadata", () => {
                    const latestStart = Math.max(0, audio.duration - playDuration);
                    audio.currentTime = Math.random() * latestStart;
                    audio.play()
                        .then(() => {
                            stopTimer = setTimeout(() => audio.pause(), playDuration * 1000);
                        })
                        .catch(() => {});
                }, { once: true });
            };

            songSelect.addEventListener("change", () => {
                if (songSelect.value === currentTrack.url) {
                    feedback.textContent = "Correct!";
                } else {
                    feedback.textContent = `Incorrect. The correct song is ${currentTrack.name}.`;
                }
                anotherButton.hidden = false;
            });

            anotherButton.addEventListener("click", startRound);
            document.querySelector("main").append(audio, songSelect, feedback, anotherButton);
            startRound();
        });
    </script>
</body>
</html>
