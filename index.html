<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Song Quiz</title>
</head>

<body>
	<header>
		<h1>Song Quiz</h1>
	</header>

	<main>
        <label for="play-duration">Play duration (seconds)</label>
        <input id="play-duration" type="number" min="1" step="1" value="10" />
        <input id="zip-upload" type="file" accept=".zip,audio/mpeg" />
	</main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        document.querySelector("#zip-upload").addEventListener("change", async event => {
            const zipFile = event.target.files[0];
            if (!zipFile) return;

            const durationInput = document.querySelector("#play-duration");
            const playDuration = Number(durationInput.value);
            if (!Number.isFinite(playDuration) || playDuration <= 0) {
                durationInput.value = 10;
                durationInput.focus();
                return;
            }

            event.target.hidden = true;

            const zip = await JSZip.loadAsync(zipFile);
            const tracks = [];

            for (const entry of Object.values(zip.files)) {
                if (entry.dir || !entry.name.toLowerCase().endsWith(".mp3")) continue;

                const audioBlob = await entry.async("blob");
                const audioUrl = URL.createObjectURL(audioBlob);
                tracks.push({ name: entry.name.split("/").pop(), url: audioUrl });
            }

            if (tracks.length === 0) {
                event.target.hidden = false;
                return;
            }

            const randomTrack = tracks[Math.floor(Math.random() * tracks.length)];
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.autoplay = true;
            audio.src = randomTrack.url;
            audio.addEventListener("loadedmetadata", () => {
                const latestStart = Math.max(0, audio.duration - playDuration);
                audio.currentTime = Math.random() * latestStart;
                audio.play()
                    .then(() => {
                        setTimeout(() => audio.pause(), playDuration * 1000);
                    })
                    .catch(() => {});
            }, { once: true });
        });
    </script>
</body>
</html>
