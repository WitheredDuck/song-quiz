<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Song Quiz</title>
</head>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
document.querySelector("#zip-upload").addEventListener("change", async event => {
    const zipFile = event.target.files[0];
    if (!zipFile) return;

    const zip = await JSZip.loadAsync(zipFile);
    const songs = document.querySelector("#songs");

    for (const entry of Object.values(zip.files)) {
        if (entry.dir || !entry.name.toLowerCase().endsWith(".mp3")) continue;

        const audioBlob = await entry.async("blob");
        const audioUrl = URL.createObjectURL(audioBlob);

        const item = document.createElement("li");
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.src = audioUrl;

        item.textContent = entry.name.split("/").pop();
        item.append(" ", audio);
        songs.appendChild(item);
    }
});
</script>
<body>
	<header>
		<h1>Song Quiz</h1>
	</header>

	<main>
        <input id="zip-upload" type="file" accept=".zip,audio/mpeg" />
        <ul id="songs"></ul>
	</main>
</body>
</html>
