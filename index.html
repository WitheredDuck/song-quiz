<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Song Quiz</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17212b;
            --muted: #65717b;
            --paper: #fff2fc;
            --panel: #4e4c4c;
            --accent: #ffaaeb;
            --accent-dark: #993999;
            --line: #ead2e4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
        }

        body::before {
            display: block;
            height: 10px;
            background: var(--accent);
            content: "";
        }

        header,
        main {
            width: min(100% - 40px, 760px);
            margin: 0 auto;
        }

        header {
            padding: 72px 0 34px;
        }

        header::before {
        color: var(--accent);
        content: "LISTEN / GUESS / REPEAT";
        font: 700 0.75rem/1.2 Arial, sans-serif;
        letter-spacing: 0.16em;
    }

        h1 {
        max-width: 560px;
        margin: 14px 0 0;
            font-size: 5rem;
        font-weight: 400;
        line-height: 0.88;
        letter-spacing: -0.04em;
    }

    main {
        padding-bottom: 72px;
    }

    main::before {
        display: block;
        margin-bottom: 28px;
        border-top: 1px solid var(--line);
        content: "";
    }

    main > label,
    main > input {
        display: block;
    }

    main > label {
        margin-bottom: 8px;
        font: 700 0.78rem/1.2 Arial, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    #play-duration {
        width: 120px;
        margin-bottom: 26px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        color: var(--ink);
        font: 1.1rem Georgia, "Times New Roman", serif;
    }

    #zip-upload {
        width: 100%;
        padding: 18px;
        border: 1px dashed #c7aac3;
        background: #f7e4f3;
        color: var(--muted);
        font: 0.95rem Arial, sans-serif;
    }

    #zip-upload::file-selector-button {
        margin-right: 14px;
        padding: 11px 16px;
        border: 0;
        background: var(--ink);
        color: white;
        font-weight: 700;
        cursor: pointer;
    }

    .quiz-audio {
        display: none;
    }

    .song-select {
        width: 100%;
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        color: var(--ink);
        font: 1rem Arial, sans-serif;
    }

    .quiz-feedback {
        min-height: 28px;
        margin: 16px 0 12px;
        font-size: 1.15rem;
    }

    .song-stats {
        margin: 24px 0;
        padding: 16px 20px;
        border-left: 3px solid var(--accent);
        background: #f7eee4;
        font: 0.9rem/1.5 Arial, sans-serif;
    }

    .song-stats h2 {
        margin: 0 0 10px;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .song-stats ul {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .song-stats li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 4px 0;
        border-top: 1px solid var(--line);
    }

    .another-button {
        padding: 13px 18px;
        border: 0;
        background: var(--accent);
        color: white;
        font: 700 0.8rem Arial, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
    }

    .another-button:hover,
    .another-button:focus-visible {
        background: var(--accent-dark);
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
        outline: 3px solid #f1ad55;
        outline-offset: 3px;
    }

    @media (max-width: 520px) {
        header,
        main {
            width: min(100% - 28px, 760px);
        }

        header {
            padding-top: 52px;
        }

        h1 {
            font-size: 3.5rem;
        }
    }
    </style>
</head>

<body>
	<header>
		<h1>Song Quiz</h1>
	</header>

	<main>
        <label for="play-duration">Play duration (seconds)</label>
        <input id="play-duration" type="number" min="1" step="1" value="10" />
        <input id="zip-upload" type="file" accept=".zip,audio/mpeg" />
	</main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        document.querySelector("#zip-upload").addEventListener("change", async event => {
            const zipFile = event.target.files[0];
            if (!zipFile) return;

            const durationInput = document.querySelector("#play-duration");
            const playDuration = Number(durationInput.value);
            if (!Number.isFinite(playDuration) || playDuration <= 0) {
                durationInput.value = 15;
                durationInput.focus();
                return;
            }

            event.target.hidden = true;

            const zip = await JSZip.loadAsync(zipFile);
            const tracks = [];

            for (const entry of Object.values(zip.files)) {
                if (entry.dir || !entry.name.toLowerCase().endsWith(".mp3")) continue;

                const audioBlob = await entry.async("blob");
                const audioUrl = URL.createObjectURL(audioBlob);
                tracks.push({ name: entry.name.split("/").pop(), url: audioUrl, played: 0, wrong: 0 });
            }

            if (tracks.length === 0) {
                event.target.hidden = false;
                return;
            }

            const audio = document.createElement("audio");
			audio.className = "quiz-audio";
            audio.hidden = true;

            const songSelect = document.createElement("select");
            songSelect.id = "song-select";
			songSelect.className = "song-select";
            const placeholder = document.createElement("option");
            placeholder.textContent = "Choose the song";
            placeholder.value = "";
            placeholder.disabled = true;
            placeholder.selected = true;
            songSelect.appendChild(placeholder);
            for (const track of tracks) {
                const option = document.createElement("option");
                option.value = track.url;
                option.textContent = track.name;
                songSelect.appendChild(option);
            }

            const feedback = document.createElement("p");
			feedback.className = "quiz-feedback";
            const stats = document.createElement("section");
            stats.className = "song-stats";
            const statsHeading = document.createElement("h2");
            statsHeading.textContent = "Song stats";
            const statsList = document.createElement("ul");
            stats.append(statsHeading, statsList);

            const updateStats = () => {
                statsList.replaceChildren(...tracks.map(track => {
                    const row = document.createElement("li");
                    const name = document.createElement("span");
                    name.textContent = track.name;
                    const count = document.createElement("span");
                    count.textContent = `${track.played} played / ${track.wrong} wrong`;
                    row.append(name, count);
                    return row;
                }));
            };

            const anotherButton = document.createElement("button");
			anotherButton.className = "another-button";
            anotherButton.type = "button";
            anotherButton.textContent = "Another song";
            anotherButton.hidden = true;
            let currentTrack;
            let stopTimer;

            const startRound = () => {
                clearTimeout(stopTimer);
                const weightedTracks = tracks.map(track => ({
                    track,
                    weight: (1 / (track.played + 1)) * (1 + track.wrong * 0.1)
                }));
                const totalWeight = weightedTracks.reduce((total, item) => total + item.weight, 0);
                let selectedWeight = Math.random() * totalWeight;
                currentTrack = weightedTracks[weightedTracks.length - 1].track;
                for (const item of weightedTracks) {
                    selectedWeight -= item.weight;
                    if (selectedWeight <= 0) {
                        currentTrack = item.track;
                        break;
                    }
                }
                currentTrack.played += 1;
                updateStats();
                songSelect.value = "";
                feedback.textContent = "";
                anotherButton.hidden = true;
                audio.pause();
                audio.src = currentTrack.url;
                audio.addEventListener("loadedmetadata", () => {
                    const latestStart = Math.max(0, audio.duration - playDuration);
                    audio.currentTime = Math.random() * latestStart;
                    audio.play()
                        .then(() => {
                            stopTimer = setTimeout(() => audio.pause(), playDuration * 1000);
                        })
                        .catch(() => {});
                }, { once: true });
            };

            songSelect.addEventListener("change", () => {
                if (songSelect.value === currentTrack.url) {
                    feedback.textContent = "Correct!";
                } else {
                    currentTrack.wrong += 1;
                    feedback.textContent = `Incorrect. The correct song is ${currentTrack.name}.`;
                    updateStats();
                }
                anotherButton.hidden = false;
            });

            anotherButton.addEventListener("click", startRound);
            document.querySelector("main").append(audio, songSelect, feedback, stats, anotherButton);
            updateStats();
            startRound();
        });
    </script>
</body>
</html>
